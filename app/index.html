<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GlassOS (Minimal)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One static vector wallpaper keeps the glass layers light to render. -->
  <div id="idleScene" class="liquid-scene" aria-hidden="true"></div>

  <header>
    <div id="leftBlock">
      <div id="greetingLine">
        <span id="greeting"></span>
        <span id="greetingTail" aria-hidden="true">
          <span id="greetingDivider"></span>
          <span id="dayNightGlyph"></span>
        </span>
      </div>
      <div id="timeRow">
        <span id="clock"><span id="clockHour"></span><span id="clockColon">:</span><span id="clockMinute"></span></span><span id="ampm"></span><span class="divider"></span>
        <div id="dateBlock">
          <span id="date"></span>
          <div id="weatherBar" class="weather-bar" aria-label="Current local weather">
            <span id="weatherIcon" aria-hidden="true"></span>
            <span id="weatherTemp"></span>
            <span id="weatherCredit">Open-Meteo</span>
          </div>
        </div>
      </div>
    </div>
    <div id="topButtons">
      <div class="pill" id="btnInputs">
        <svg viewBox="0 0 24 24"><rect x="5.5" y="2.8" width="13" height="18.4" rx="3.2"/><path d="M9 7.2h6M9 11h6M9 14.8h6"/></svg>
        <span>Inputs</span>
      </div>
      <div class="pill" id="btnWifi">
        <svg viewBox="0 0 24 24"><path d="M2.5 8.8a14.2 14.2 0 0 1 19 0M5.7 12a9.4 9.4 0 0 1 12.6 0M9 15.3a4.6 4.6 0 0 1 6 0"/><circle cx="12" cy="19" r="1" class="wifi-dot"/></svg>
        <span id="wifiLabel">Wi-Fi</span>
      </div>
      <div class="pill" id="btnSettings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-1.99 1.68l-.31 1.84a8 8 0 0 0-1.72 1L6.02 5.74a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l1.5.93a8.2 8.2 0 0 0 0 2l-1.5.93a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l1.74-.78a8 8 0 0 0 1.72 1l.31 1.84A2 2 0 0 0 11.78 22h.44a2 2 0 0 0 1.99-1.68l.31-1.84a8 8 0 0 0 1.72-1l1.74.78a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-1.5-.93a8.2 8.2 0 0 0 0-2l1.5-.93a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-1.74.78a8 8 0 0 0-1.72-1l-.31-1.84A2 2 0 0 0 12.22 2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </div>
    </div>
  </header>

  <!-- Everything below the header scrolls together: dock band, glass highlight and tiles. -->
  <div id="viewport">
    <div id="stage">
      <div id="dockBand"></div>
      <div id="glass"></div>
      <div id="tiles"></div>
      <div id="addAppsBar" aria-label="App library">
        <div class="pill add-apps-button" id="btnAddApps" role="button" tabindex="0" aria-label="Add apps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add Apps</span>
        </div>
      </div>
      <footer id="signatureFooter" aria-label="Zen Mode">
        <div class="signatureRule" aria-hidden="true"></div>
        <!-- Hidden source image for DVD Bounce's optional signature-logo mode. -->
        <img class="signatureLogo" src="alex-signature.png" alt="" aria-hidden="true">
        <button id="btnFooterZen" type="button" aria-label="Zen Mode" title="Zen Mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"><path d="M12 12C8.6 10.8 8.4 6.9 12 3.6c3.6 3.3 3.4 7.2 0 8.4Z"/><path d="M12 12C8.6 10.8 8.4 6.9 12 3.6c3.6 3.3 3.4 7.2 0 8.4Z" transform="rotate(60 12 12)"/><path d="M12 12C8.6 10.8 8.4 6.9 12 3.6c3.6 3.3 3.4 7.2 0 8.4Z" transform="rotate(120 12 12)"/><path d="M12 12C8.6 10.8 8.4 6.9 12 3.6c3.6 3.3 3.4 7.2 0 8.4Z" transform="rotate(180 12 12)"/><path d="M12 12C8.6 10.8 8.4 6.9 12 3.6c3.6 3.3 3.4 7.2 0 8.4Z" transform="rotate(240 12 12)"/><path d="M12 12C8.6 10.8 8.4 6.9 12 3.6c3.6 3.3 3.4 7.2 0 8.4Z" transform="rotate(300 12 12)"/></g><circle cx="12" cy="12" r="1.15" fill="currentColor"/></svg>
        </button>
      </footer>
    </div>
  </div>

  <!-- Shared glass dropdown for Inputs and Settings. -->
  <div id="inputsPanel" class="hidden"></div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
